name: Feature request
description: Ask for a new feature in the gem.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Write what you want to do and why the gem does not let you do it now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: Write the code that you want to write.
      render: ruby
      placeholder: "Byomailer.contacts.add(\"ana@example.com\", list: 3)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
      description: Write the other solutions that you tried.
